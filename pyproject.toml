[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "occlusion-aware-tool-localization"
version = "0.1.0"
description = "Synthetic tool segmentation and keypoint localization, trained from scratch"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pillow>=10,<12", "torch>=2.5,<2.6", "onnx>=1.17,<1.18", "onnxruntime>=1.20,<1.21"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<0.9"]

[project.scripts]
toolloc = "toolloc.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
